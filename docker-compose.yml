services:
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    environment:
      WRECKR_API_ADDR: ":8080"
      WRECKR_RUN_TIMEOUT_SECONDS: "300"
      WRECKR_MAX_CONCURRENCY: "1000"
      WRECKR_MAX_REQUEST_RATE_PER_SECOND: "5000"
      WRECKR_MAX_RUN_DURATION_SECONDS: "300"
      WRECKR_MAX_REQUEST_BODY_BYTES: "1048576"
      WRECKR_TARGET_ALLOWLIST: ${WRECKR_TARGET_ALLOWLIST:-}
      WRECKR_STORE: ${WRECKR_STORE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://wreckr:wreckr@postgres:5432/wreckr?sslmode=disable}
      REDIS_ADDR: redis:6379
      WRECKR_S3_ENDPOINT: http://minio:9000
      WRECKR_S3_REGION: us-east-1
      WRECKR_S3_BUCKET: wreckr-artifacts
      WRECKR_S3_ACCESS_KEY_ID: minioadmin
      WRECKR_S3_SECRET_ACCESS_KEY: minioadmin
      WRECKR_S3_DISABLE_SSL: "true"
      WRECKR_S3_FORCE_PATH_STYLE: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.worker
    environment:
      WRECKR_RUN_TIMEOUT_SECONDS: "300"
      WRECKR_STORE: ${WRECKR_STORE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://wreckr:wreckr@postgres:5432/wreckr?sslmode=disable}
      REDIS_ADDR: redis:6379
      WRECKR_WORKER_CONCURRENCY: "4"
      WRECKR_S3_ENDPOINT: http://minio:9000
      WRECKR_S3_REGION: us-east-1
      WRECKR_S3_BUCKET: wreckr-artifacts
      WRECKR_S3_ACCESS_KEY_ID: minioadmin
      WRECKR_S3_SECRET_ACCESS_KEY: minioadmin
      WRECKR_S3_DISABLE_SSL: "true"
      WRECKR_S3_FORCE_PATH_STYLE: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_WRECKR_API_URL: "http://localhost:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3000:3000"
    depends_on:
      - api

  demo-api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo-api
    environment:
      DEMO_API_ADDR: ":9090"
    ports:
      - "9090:9090"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wreckr
      POSTGRES_USER: wreckr
      POSTGRES_PASSWORD: wreckr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wreckr -d wreckr"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wreckr-postgres:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deployments/postgres/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://wreckr:wreckr@postgres:5432/wreckr?sslmode=disable"
      - "up"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9091:9090"
    volumes:
      - ./deployments/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  minio:
    image: minio/minio:RELEASE.2024-06-06T09-36-42Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - wreckr-minio:/data
    command: server /data --console-address ":9001"

  minio-create-buckets:
    image: minio/mc:RELEASE.2024-06-06T15-05-49Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/wreckr-artifacts;
      /usr/bin/mc anonymous set public myminio/wreckr-artifacts;
      exit 0;
      "

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  wreckr-postgres:
  wreckr-minio:
